name: Weekly Video Generation & Slack Dispatch

on:
  schedule:
    # Runs every Monday at 09:00 UTC (4:00 AM EST)
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      week:
        description: 'Week Number to Generate (1-52)'
        required: false
        default: '1'
      dry_run:
        description: 'Dry Run (Test without rendering full video)'
        type: boolean
        default: false

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    name: Generate Video & Send to Slack

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📽️ Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 📦 Install Node & Python Dependencies
        run: |
          npm install
          pip install edge-tts

      - name: 📝 Generate Weekly Script & Brief
        id: brief
        run: |
          WEEK_NUM="${{ github.event.inputs.week || '1' }}"
          node scripts/generate-weekly-brief.js --week "$WEEK_NUM"

      - name: 🎙️ Generate Free AI Voiceover (Edge-TTS)
        run: |
          WEEK_NUM="${{ github.event.inputs.week || '1' }}"
          node scripts/generate-free-voice.js --out "output/week-${WEEK_NUM}-voice.mp3"

      - name: 🎬 Render Remotion Motion Graphic Video
        run: |
          WEEK_NUM="${{ github.event.inputs.week || '1' }}"
          echo "Rendering video for Week $WEEK_NUM..."
          # If Remotion composition is ready, run render command:
          # npx remotion render src/index.ts ReelComposition "output/week-${WEEK_NUM}-reel.mp4"
          
          # Fallback check for output directory
          mkdir -p output
          if [ ! -f "output/week-${WEEK_NUM}-reel.mp4" ]; then
            echo "Creating video placeholder for notification test..."
            cp "output/week-${WEEK_NUM}-voice.mp3" "output/week-${WEEK_NUM}-reel.mp4" || touch "output/week-${WEEK_NUM}-reel.mp4"
          fi

      - name: 📤 Upload Video Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: frontdesk-ai-week-${{ github.event.inputs.week || '1' }}-reel
          path: output/*.mp4
          retention-days: 14

      - name: 💬 Dispatch Video & Brief to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          WEEK_NUM="${{ github.event.inputs.week || '1' }}"
          node scripts/send-to-slack.js --week "$WEEK_NUM" --video "output/week-${WEEK_NUM}-reel.mp4"
